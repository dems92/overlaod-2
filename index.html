<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="description" content="Overload : suivi de musculation et de surcharge progressive.">
<meta name="application-name" content="Overload">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Overload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-display: "Montserrat", "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --bg:#000000; --surface:#0D0D0E; --surface-2:#1A1A1A;
  --label:#E4E2DF; --label-2:#A09D99; --label-3:#6E6C69;
  --separator:rgba(255,255,255,.07); --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.13);
  --accent:#FF2D2D; --accent-2:#8F1616; --on-accent:#fff; --green:#34c759;
  --glass:rgba(0,0,0,.72); --glass-edge:rgba(255,255,255,.09); --blur:blur(22px) saturate(160%);
  --r-control:10px; --r-group:14px; --r-sheet:28px;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
  --topbar-h:calc(var(--top) + 48px); --tabbar-h:calc(var(--bottom) + 64px);
}
@media (prefers-contrast: more){ :root{ --separator:rgba(255,255,255,.35); --glass:var(--bg); } }
@media (prefers-reduced-transparency: reduce){ :root{ --glass:var(--bg); --blur:none; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:16px;line-height:1.4;overscroll-behavior:none}
body{overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input{font:inherit;color:inherit}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Barre du haut : heure en continu */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--topbar-h);padding:var(--top) 20px 0;display:flex;align-items:center;justify-content:space-between;z-index:20}
.topbar::before{content:"";position:absolute;inset:0 0 -14px 0;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);-webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent);z-index:-1}
.clock{font-family:var(--font-display);font-weight:600;font-size:1.3rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.topright{display:flex;align-items:center;gap:8px;color:var(--label-2);font-size:.8125rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--label-3)}
.dot.live{background:var(--green)}

/* Écrans */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--topbar-h) + 6px) 16px calc(var(--tabbar-h) + 32px);-webkit-overflow-scrolling:touch;animation:fadein .18s ease-out}
.screen[hidden]{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.col{width:min(100%,640px);margin:0 auto}
h1.large{font:700 2.125rem/1.1 var(--font-display);letter-spacing:-.022em;margin:8px 0 18px}
h2{margin:0}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.titlerow h1{margin-bottom:18px}
.sub{color:var(--label-2);font-size:.9375rem;margin:6px 0 0}
.s{color:var(--label-2);font-size:.8125rem;letter-spacing:.01em}
.grow{flex:1;min-width:0}
.sec{font-size:.8125rem;color:var(--label-2);margin:22px 4px 8px;letter-spacing:.01em;font-weight:500}

/* Cartes avec filet dégradé 1px */
.card{position:relative;border-radius:var(--r-group);border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(145deg,rgba(255,45,45,.5),rgba(255,255,255,.07) 38%,rgba(255,255,255,.04)) border-box}
.card+.card{margin-top:12px}
.group{background:var(--surface);border-radius:var(--r-group);overflow:hidden;border:1px solid var(--separator)}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--separator)}
button.row:active{background:var(--fill)}
.row .t{font-weight:500}
.chev{color:var(--label-3);width:18px;height:18px}
.hero{padding:26px 20px 20px;text-align:center}
.hero h2{font:700 1.5rem/1.2 var(--font-display);letter-spacing:-.015em;margin-top:12px}
.hero .btn{margin-top:20px}
.hero-ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:var(--accent);color:#fff;box-shadow:0 0 0 6px var(--bg),0 0 30px rgba(255,45,45,.5)}
.hero-ico svg{width:30px;height:30px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{padding:14px 16px}
.stat .v{font:700 1.75rem/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.9rem;color:var(--label-2);font-weight:500;margin-left:3px}
.stat .k{color:var(--label-2);font-size:.8125rem;margin-top:4px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:600;transition:transform .1s,opacity .3s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 0 22px rgba(255,45,45,.35)}
.btn.secondary{border:1px solid rgba(255,45,45,.55);background:rgba(153,27,36,.18)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.txt{color:var(--accent);font-weight:500;padding:10px 6px;min-height:44px}
.txt:active{opacity:.5}
.txt.muted{color:var(--label-2)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--fill);transition:transform .1s}
.icon-btn:active{transform:scale(.94);background:var(--fill-2)}
.icon-btn.accent{background:var(--accent);box-shadow:0 0 18px rgba(255,45,45,.35)}
.chip{min-width:44px;height:40px;padding:0 12px;border-radius:999px;background:var(--fill);font-weight:600;font-size:.9375rem;font-variant-numeric:tabular-nums;text-align:center;transition:transform .1s,background .15s}
.chip:active{background:var(--accent-2);transform:scale(.95)}
.chip.on{background:var(--accent);color:#fff}
.badge{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label-2);font-variant-numeric:tabular-nums}
.badge.ok{background:rgba(255,45,45,.18);color:var(--accent)}

/* Barre d'onglets */
.tabbar{position:fixed;inset:auto 0 0 0;height:var(--tabbar-h);padding-bottom:var(--bottom);z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tabbar::before{content:"";position:absolute;inset:-16px 0 0 0;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);-webkit-mask-image:linear-gradient(transparent,#000 16px);mask-image:linear-gradient(transparent,#000 16px);z-index:-1}
.tabbar::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,45,45,.5) 50%,transparent)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;color:var(--label-2);font-size:.6875rem;font-weight:500;position:relative;transition:color .15s}
.tab:active{opacity:.6}
.tab[aria-current="true"]{color:var(--accent)}
.tab[aria-current="true"]::after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.fab{justify-self:center;width:62px;height:62px;border-radius:50%;margin-top:-24px;display:grid;place-items:center;background:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--bg),0 0 28px rgba(255,45,45,.55);transition:transform .12s;position:relative}
.fab svg{width:30px;height:30px;stroke-width:2}
.fab:active{transform:scale(.94)}
.fab.live::after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* Séance en cours */
.wk-head{position:sticky;top:calc(var(--topbar-h) - 2px);z-index:5;padding:14px 16px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:14px}
.lbl{font-size:.75rem;color:var(--label-2);font-weight:500}
.big{font:700 2.9rem/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px}
.rest{padding:8px 14px;border-radius:14px;background:var(--fill);min-width:112px}
.rest:active{background:var(--accent-2)}
.rest .mid{font:700 1.5rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.rest.over .mid{color:var(--accent)}
.prog{height:3px;background:var(--fill);border-radius:2px;overflow:hidden;grid-column:1/-1;margin-top:2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .3s}
.ex-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;min-height:60px}
.ex-name{font-weight:600;font-size:1.0625rem;letter-spacing:-.005em}
.ex .chev{transition:transform .2s}
.ex.open .chev{transform:rotate(90deg)}
.ex.complete .ex-name{color:var(--label-2)}
.ex-body{padding:0 16px 14px}
.wt{padding:12px;border-radius:12px;background:var(--surface-2);display:grid;gap:10px}
.wt-top{display:flex;align-items:center;gap:10px}
.wt-val{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px}
.wt-in{width:5.4ch;background:none;border:0;text-align:center;font:700 2rem/1.1 var(--font-display);letter-spacing:-.02em;padding:0;font-variant-numeric:tabular-nums}
.wt-in:focus{outline:none;color:var(--accent)}
.wt-val span{color:var(--label-2);font-weight:500}
.wt-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wt-chips .chip{min-width:0}
.set{margin-top:10px;padding:12px;border-radius:12px;background:var(--surface-2);display:grid;gap:10px}
.set-top{display:flex;align-items:center;gap:10px}
.set-n{font-weight:600;min-width:62px}
.set-n small{display:block;color:var(--label-2);font-weight:400;font-size:.75rem}
.stepper{display:flex;align-items:center;gap:6px;flex:1;justify-content:center}
.reps-in{width:3.2ch;background:none;border:0;text-align:center;font:700 1.75rem/1 var(--font-display);padding:0;font-variant-numeric:tabular-nums}
.reps-in:focus{outline:none;color:var(--accent)}
.set-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.set-chips .chip{min-width:0}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--fill-2);display:grid;place-items:center;color:transparent;transition:transform .1s,background .15s,border-color .15s}
.check:active{transform:scale(.92)}
.check svg{stroke-width:2.5}
.set.done{grid-template-columns:1fr;padding:0;background:none;margin-top:6px}
.set.done button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;background:rgba(255,45,45,.08);min-height:48px}
.set.done .check{width:28px;height:28px;background:var(--accent);border-color:var(--accent);color:#fff}
.set.done .check svg{width:16px;height:16px}
.set.done b{font-variant-numeric:tabular-nums}
.ex-foot{display:flex;justify-content:space-between;margin-top:6px}
.add-row{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r-group);border:1px dashed rgba(255,45,45,.45);color:var(--accent);font-weight:600;margin-top:12px}
.add-row:active{background:rgba(255,45,45,.08)}
.divider{height:1px;margin:20px 0;background:linear-gradient(90deg,transparent,rgba(255,45,45,.55) 50%,transparent)}

/* Champs */
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px}
.field input{flex:1;background:none;border:0;font-size:1.0625rem;padding:12px 0;min-width:0}
.field input:focus{outline:none}
.field input::placeholder{color:var(--label-3)}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-radius:12px;background:var(--fill);color:var(--label-2)}
.search input{flex:1;background:none;border:0;font-size:1rem;color:var(--label);min-width:0}
.search input:focus{outline:none}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll .chip{flex:none;height:36px}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--fill);gap:2px}
.seg button{flex:1;height:34px;border-radius:10px;font-weight:600;font-size:.875rem;color:var(--label-2);transition:background .2s,color .2s}
.seg button[aria-checked="true"]{background:var(--accent);color:#fff}
.mini-step{display:flex;align-items:center;gap:6px}
.mini-step button{width:36px;height:36px;border-radius:50%;background:var(--fill);font-weight:700;font-size:1.1rem;display:grid;place-items:center}
.mini-step button:active{background:var(--accent-2)}
.mini-step b{min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.empty{padding:28px 20px;text-align:center;color:var(--label-2)}
.empty b{display:block;color:var(--label);font-size:1.0625rem;margin-bottom:4px}

/* Calendrier */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h2{font:600 1.25rem var(--font-display);text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px}
.cal-dow{text-align:center;font-size:.75rem;color:var(--label-2);padding:4px 0;font-weight:500}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500;font-variant-numeric:tabular-nums;position:relative}
.day:active{background:var(--fill)}
.day.out{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 1px var(--label-3)}
.day.has i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(255,45,45,.7)}
.day.sel{background:var(--accent);color:#fff}
.day.sel i{background:#fff;box-shadow:none}
.sess{padding:14px 16px;display:block;width:100%;text-align:left}
.sess .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sess .nm{font-weight:600;font-size:1.0625rem}
.sess .time{font:600 1rem var(--font-display);color:var(--accent);font-variant-numeric:tabular-nums}
.sess .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;color:var(--label-2);font-size:.8125rem}

/* Graphiques */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--label-2);font-size:9px;font-family:var(--font)}
.donut-wrap{display:flex;align-items:center;gap:18px;padding:16px}
.donut-wrap svg.donut{width:132px;height:132px;flex:none}
.legend{display:grid;gap:7px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:.8125rem}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-variant-numeric:tabular-nums;color:var(--label-2);font-weight:500}
.pad{padding:14px 16px}
.delta{font-weight:600;font-size:.8125rem;color:var(--green);font-variant-numeric:tabular-nums}
.delta.neg{color:var(--label-2)}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.rec .stat{padding:12px}
.rec .v{font-size:1.25rem}

/* Feuilles (bottom sheets) */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0}
.sheet{position:absolute;left:0;right:0;bottom:-120px;margin:0 auto;width:min(100%,640px);background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;border:1px solid var(--glass-edge);border-bottom:0;box-shadow:0 -12px 48px rgba(0,0,0,.7);display:flex;flex-direction:column;will-change:transform;padding-bottom:120px;overflow:hidden}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,45,45,.6) 50%,transparent)}
.drag{touch-action:none;flex:none;cursor:grab}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill-2);margin:8px auto 2px}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 12px 8px;min-height:48px}
.sheet-h h2{font:600 1.0625rem var(--font-display);text-align:center;max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h .r{text-align:right}
.sheet-h .txt[disabled]{opacity:.35;pointer-events:none}
.sheet-h .txt.bold{font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:4px 16px calc(var(--bottom) + 24px);-webkit-overflow-scrolling:touch}
.sheet-body.flush{padding-left:0;padding-right:0}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 14px);transform:translateX(-50%) translateY(10px);background:var(--surface-2);border:1px solid var(--glass-edge);padding:11px 18px;border-radius:999px;font-weight:500;font-size:.9375rem;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){
  .screen{animation:none}
  .fab.live::after{animation:none}
  .btn,.chip,.icon-btn,.fab,.check,.ex .chev{transition:none}
  .toast{transition:opacity .2s}
}
@media (max-width:380px){ .big{font-size:2.5rem} .rest{min-width:98px} }

/* ===== Charte v2 : noir pur, rouge #FF2D2D, Montserrat + Inter ===== */
body{background:#000}
.ambient{position:fixed;inset:0 0 auto 0;height:380px;pointer-events:none;z-index:0;opacity:.8;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.ambient svg{width:100%;height:100%;stroke-width:1;stroke-linecap:round}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.clock{font-family:var(--font);font-weight:600;font-variant-numeric:tabular-nums;justify-self:start}
.topright{justify-self:end}
.topchrono{justify-self:center;display:flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,45,45,.6);background:rgba(255,45,45,.1);font:700 .9375rem var(--font);font-variant-numeric:tabular-nums;transition:transform .1s,background .2s}
.topchrono:active{transform:scale(.96)}
.topchrono::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(255,45,45,.9)}
.topchrono[hidden]{display:none}
.topchrono.masked{border-color:var(--separator);background:var(--fill);color:var(--label-2)}
.topchrono.masked::before{background:var(--label-3);box-shadow:none}
body.has-chrono #today{display:none}
.dot.live{background:var(--label);box-shadow:0 0 6px rgba(255,255,255,.35)}
.dot.err{background:var(--accent)}
h1.large::after{content:"";display:block;width:28px;height:2px;background:var(--accent);margin-top:10px;box-shadow:0 0 8px rgba(255,45,45,.7)}
.sec{text-transform:uppercase;letter-spacing:.16em;font-size:.6875rem;font-weight:500;color:var(--label-2);margin:26px 4px 10px}
.card{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(145deg,rgba(255,45,45,.30),rgba(255,255,255,.09) 40%,rgba(255,255,255,.05)) border-box}
.btn.secondary{background:#000;border:1px solid rgba(255,255,255,.28)}
.search{background:var(--surface);border:1px solid var(--separator);border-radius:999px}
.tab svg{stroke-width:1.5}
.delta{color:var(--label)}.delta.neg{color:var(--label-2)}
.seg{background:none;padding:0;border-radius:0;gap:0;border-bottom:1px solid var(--separator)}
.seg button{background:none!important;color:var(--label-2);height:42px;border-radius:0;position:relative;font-weight:500}
.seg button[aria-checked="true"]{color:var(--label)}
.seg button[aria-checked="true"]::after{content:"";position:absolute;left:16%;right:16%;bottom:-1px;height:2px;background:var(--accent);box-shadow:0 0 8px rgba(255,45,45,.7)}
.thumb{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;border:1px solid var(--separator);background:radial-gradient(circle at 50% 50%,rgba(255,45,45,.5),rgba(255,45,45,0) 72%),#0a0a0a;color:var(--label)}
.thumb svg{width:20px;height:20px}
.hero{text-align:left;padding:24px 20px 20px}
.hero h2{font:700 1.75rem/1.15 var(--font-display);letter-spacing:-.015em;margin:0}
.red{color:var(--accent)}
.hero .redline{width:28px;height:2px;background:var(--accent);margin:18px 0 20px;box-shadow:0 0 8px rgba(255,45,45,.7)}
.hero .btn{margin-top:0}.hero .btn+.btn{margin-top:10px}
.stat-row.three{grid-template-columns:repeat(3,1fr);gap:10px}
.stat-row>.card,.rec>.card,.lib-grid>.card{margin-top:0}
.stat{min-width:0}.stat .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.three .stat{padding:12px}.three .stat .v{font-size:1.25rem}.three .v small{font-size:.7rem}
.step{font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--label-2);margin-bottom:2px}
.kc{color:var(--accent);font-size:.8125rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.sess .meta .kc{margin:0}
.ex.open{box-shadow:0 0 0 1px rgba(255,45,45,.28),0 0 28px rgba(255,45,45,.07)}
/* Chronomètre circulaire (façon Apple) : en haut de la page, il défile avec elle */
.stopwatch{padding:18px 16px 16px;text-align:center}
.ring-wrap{position:relative;width:min(70vw,250px);aspect-ratio:1;margin:14px auto 20px}
.ring{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:9}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(255,45,45,.65))}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;gap:6px}
.ring-time{font:700 3.2rem/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ring-sub{color:var(--label-2);font-size:.8125rem}
.stopwatch.over .ring-time{color:var(--accent)}
.sw-btns{display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.sw-btn{width:80px;height:80px;border-radius:50%;font-weight:600;font-size:.9375rem;display:grid;place-items:center;box-shadow:0 0 0 3px #000,0 0 0 4px var(--c);transition:transform .1s,opacity .2s}
.sw-btn:active{transform:scale(.94)}
.sw-btn[disabled]{opacity:.35;pointer-events:none}
.sw-btn.gray{background:var(--surface-2);color:var(--label);--c:#3a3a3a}
.sw-btn.go{background:var(--accent);color:#fff;--c:var(--accent);box-shadow:0 0 0 3px #000,0 0 0 4px var(--accent),0 0 26px rgba(255,45,45,.45)}
.sw-btn.stop{background:rgba(255,45,45,.14);color:var(--accent);--c:var(--accent)}
.sw-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;padding-top:14px;border-top:1px solid var(--separator)}
.sw-stats div{display:flex;flex-direction:column;gap:2px}
.sw-stats b{font:700 1.25rem var(--font);font-variant-numeric:tabular-nums}
.sw-stats div:first-child b{color:var(--accent)}
.sw-stats span{color:var(--label-2);font-size:.75rem}
.stopwatch .prog{margin-top:16px}

/* ===== Overload : bouton central animé + barre du bas ===== */
.fab{background:#000;box-shadow:0 0 0 5px #000,0 0 26px rgba(255,45,45,.55);overflow:visible;animation:breathe 2.8s ease-in-out infinite}
.fab img{width:100%;height:100%;border-radius:50%;display:block;position:relative;z-index:1}
.fab-ring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 12%,#FF2D2D 22%,transparent 32% 50%,#FF2D2D 72%,transparent 82%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:spin 5s linear infinite;filter:drop-shadow(0 0 4px rgba(255,45,45,.9))}
.fab.live::after{z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{box-shadow:0 0 0 5px #000,0 0 42px rgba(255,45,45,.85)}}
.tabbar::before{background:radial-gradient(150px 74px at 50% 0%,rgba(255,45,45,.26),transparent 70%),var(--glass)}
.tabbar::after{height:1.5px;background:linear-gradient(90deg,transparent 0%,rgba(255,45,45,.12) 25%,#FF2D2D 50%,rgba(255,45,45,.12) 75%,transparent 100%);background-size:200% 100%;animation:sweep 4s linear infinite;box-shadow:0 0 10px rgba(255,45,45,.6)}
@keyframes sweep{from{background-position:200% 0}to{background-position:0 0}}
.tab[aria-current="true"] svg{filter:drop-shadow(0 0 6px rgba(255,45,45,.85))}
.cs{font-size:.6em;opacity:.7;margin-left:1px}
.ring-time{font-size:2.9rem}
.brand{display:block;width:min(100%,380px);height:auto;margin:-4px auto 6px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 13%,#000 87%,transparent),linear-gradient(transparent,#000 12%,#000 86%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 13%,#000 87%,transparent),linear-gradient(transparent,#000 12%,#000 86%,transparent);mask-composite:intersect}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib-grid .card{margin-top:0}
.card.lib{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;text-align:left;min-height:118px}
.card.lib:active{transform:scale(.98)}
.card.lib b{font:700 1rem var(--font-display)}
.thumb.tag{font:700 .7rem var(--font-display);letter-spacing:.03em}
.about{display:flex;align-items:center;gap:14px;margin:26px 4px 0}
.about img{width:48px;height:48px;border-radius:50%;box-shadow:0 0 18px rgba(255,45,45,.45)}
.about b{display:block;font:700 1.0625rem var(--font-display)}
.about span{color:var(--label-2);font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){.fab,.fab-ring,.tabbar::after{animation:none}}

/* ===== Notifications ===== */
.key-in{flex:1;width:100%;background:var(--fill);border:1px solid var(--separator);border-radius:12px;padding:11px 14px;font-size:1rem;color:var(--label);min-width:0}
.key-in:focus{outline:none;border-color:var(--accent)}
.sw{flex:none;width:51px;height:31px;border-radius:999px;background:var(--fill-2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#E4E2DF;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
@media (prefers-reduced-motion: reduce){.sw,.sw::after{transition:none}}

/* ===== Options d'exercice, favoris, poids par série ===== */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.opt{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--separator);background:var(--surface-2);font-weight:500;font-size:.875rem;transition:transform .1s,background .2s,border-color .2s}
.opt:active{transform:scale(.96)}
.opt svg{width:18px;height:18px}
.opt.on{border-color:rgba(255,45,45,.7);background:rgba(255,45,45,.12);color:var(--accent)}
.favmark{color:var(--accent);font-size:.85em}
.pw-row{display:flex;align-items:center;gap:6px;padding-top:10px;border-top:1px solid var(--separator)}
.pw-row .chip{flex:none;min-width:0;width:44px;padding:0}
.pw-val{flex:1;display:flex;align-items:baseline;justify-content:center;gap:4px;min-width:0}
.pw-in{width:4.6ch;background:none;border:0;text-align:center;font:700 1.4rem/1.1 var(--font-display);padding:0;font-variant-numeric:tabular-nums}
.pw-in:focus{outline:none;color:var(--accent)}
.pw-val span{color:var(--label-2);font-size:.8125rem;font-weight:500}
.row.split{padding:0;gap:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 4px 9px 16px;text-align:left}
.row-main:active{background:var(--fill)}
.star{width:52px;align-self:stretch;display:grid;place-items:center;color:var(--label-3);transition:color .2s,transform .1s}
.star:active{transform:scale(.88)}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor;filter:drop-shadow(0 0 5px rgba(255,45,45,.7))}
@media (prefers-reduced-motion: reduce){.opt,.star{transition:none}}

/* ===== Bis sous la série ===== */
.reps-in,.bis-reps-in{width:3.2ch;background:none;border:0;text-align:center;font:700 1.75rem/1 var(--font-display);padding:0;font-variant-numeric:tabular-nums}
.bis-reps-in:focus{outline:none;color:var(--accent)}
.pw-in,.bis-pw-in{width:4.6ch;background:none;border:0;text-align:center;font:700 1.4rem/1.1 var(--font-display);padding:0;font-variant-numeric:tabular-nums}
.bis-pw-in:focus{outline:none;color:var(--accent)}
.bis-slot{padding-left:18px;margin-top:6px}
.bis-add{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px dashed rgba(255,45,45,.45);color:var(--accent);font-size:.8125rem;font-weight:600;transition:transform .1s,background .2s}
.bis-add:active{transform:scale(.96);background:rgba(255,45,45,.1)}
.bis-add svg{width:15px;height:15px}
.bis{position:relative;margin:8px 0 0 20px}
.bis::before{content:"";position:absolute;left:-12px;top:-8px;height:calc(50% + 8px);width:12px;border-left:2px solid rgba(255,45,45,.55);border-bottom:2px solid rgba(255,45,45,.55);border-bottom-left-radius:10px}
.bis .set{margin-top:0;background:rgba(255,45,45,.06);border:1px solid rgba(255,45,45,.28)}
.bis .set.done{background:none;border:0}
.bis-rm{justify-self:start;min-height:36px;padding:0 4px}
.bis,.bis .set{min-width:0}
.bis{margin-left:16px}
.bis .set{padding:10px;gap:8px}
.bis .set-n{min-width:44px}
.bis .stepper{gap:2px}
.bis .check{width:44px;height:44px}
.bis .set-chips{gap:6px}
.bis .pw-row{gap:4px}
.bis .pw-row .chip{width:40px}
.bis .set.done{padding:0}
@media (max-width:380px){
  .bis{margin-left:10px}.bis::before{left:-8px;width:8px}
  .bis .set{padding:8px}
  .bis .set-n{min-width:38px;font-size:.9375rem}
  .bis .check{width:40px;height:40px}
  .bis .pw-row .chip{width:36px;font-size:.8125rem}
  .bis .pw-row{gap:3px}
  .ex-body{padding:0 12px 12px}
  .set{padding:10px}.set-top{gap:6px}.set-n{min-width:52px}
  .pw-row{gap:3px}.pw-row .chip{width:38px;font-size:.8125rem}
  .set-chips{gap:6px}.check{width:44px;height:44px}
}

/* ===== Formulaires : jamais de blanc natif ===== */
input,select,textarea{background-color:transparent;color:var(--label)}
input[type=search]{-webkit-appearance:none;appearance:none}
input::-webkit-search-decoration,input::-webkit-search-cancel-button{-webkit-appearance:none}
::selection{background:rgba(255,45,45,.35);color:var(--label)}

/* ===== Poids général + poids par série ===== */
.wt-lbl{font-size:.75rem;color:var(--label-2);font-weight:500;text-align:center}
.pw-val.ov .pw-in{color:var(--accent)}
.pw-auto{font-size:.6875rem;color:var(--label-3);text-align:center;margin-top:-4px}
.pw-auto button{color:var(--accent);font-weight:600;padding:2px 4px}

/* ===== Alerte de repos (pop-up) ===== */
.alert{position:fixed;left:50%;top:calc(var(--topbar-h) + 8px);transform:translate(-50%,-160%);width:min(calc(100% - 32px),420px);z-index:90;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(26,26,26,.95);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(255,45,45,.55);box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 24px rgba(255,45,45,.25);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);text-align:left}
.alert.show{transform:translate(-50%,0)}
.alert[hidden]{display:none}
.alert .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.alert .ai svg{width:22px;height:22px}
.alert b{display:block;font-size:.9375rem}
.alert span{color:var(--label-2);font-size:.8125rem}
@media (prefers-reduced-motion: reduce){.alert{transition:none}}

/* ===== Widget chronomètre flottant ===== */
.mini{position:fixed;z-index:50;left:0;top:0;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;border-radius:999px;background:rgba(13,13,14,.93);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(255,45,45,.55);box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 18px rgba(255,45,45,.2);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.mini[hidden]{display:none}
.mini .mt{display:flex;flex-direction:column;line-height:1.15;min-width:66px}
.mini .mt b{font:700 1.15rem var(--font);font-variant-numeric:tabular-nums}
.mini .mt small{font-size:.6875rem;color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini.over .mt b{color:var(--accent)}
.mini button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--fill-2)}
.mini button svg{width:18px;height:18px}
.mini button.go{background:var(--accent);color:#fff}
.mini button:active{transform:scale(.92)}
.mini button[hidden]{display:none}

/* ===== Salles ===== */
.gym-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--separator);background:var(--surface-2);font-size:.8125rem;font-weight:500;color:var(--label-2);text-transform:none;letter-spacing:0}
.gym-pill svg{width:15px;height:15px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--fill-2);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.add-in{flex:1;min-width:0;background:none;border:0;font-size:1rem;padding:12px 0}
.add-in:focus{outline:none}
.add-in::placeholder{color:var(--label-3)}

/* ===== Catalogue : filtres fins ===== */
.chips-scroll.sub{padding-top:0}
.chips-scroll.sub .chip{height:32px;font-size:.8125rem;font-weight:500;background:var(--surface-2);border:1px solid var(--separator)}
.chips-scroll.sub .chip.on{background:rgba(255,45,45,.14);border-color:rgba(255,45,45,.6);color:var(--accent)}
.chips-lbl{flex:none;align-self:center;font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--label-3);padding-right:2px}
.tagline{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px}
.tg{font-size:.6875rem;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--label-2)}
.tg.p{background:rgba(255,45,45,.12);color:#FF7A7A}
.tg.k{background:none;padding-left:0;color:var(--accent)}
</style>

function jointsFor(n,g){if(g==='Cou')return['Cou'];for(const [re,j] of JOINT_RULES)if(re.test(n))return j;return g==='Abdos'?['Colonne & tronc']:['Épaule','Coude']}
function portionFor(n,g){for(const [re,p] of (PORTION_RULES[g]||[]))if(re.test(n))return p;return ''}

  const joints=jointsFor(n0,g),portion=por||portionFor(n0,g),type=joints.length>1||joints[0]==='Corps entier'?'Polyarticulaire':'Isolation',eq=EQ[code]||'Autre';
  CATALOG.push({name,group:g,eq,code,portion,joints,type,n:norm([name,g,portion,eq,joints.join(' '),type].join(' '))})}}
const groupOf=name=>{const m=CATALOG.find(c=>c.name===name);return m?m.group:'Autre'};
const codeOf=name=>{const m=CATALOG.find(c=>c.name===name);return m?m.code:'au'};

const MET_BY_CODE={ba:5,ha:4,ma:3.5,po:3.5,pc:4,el:3,kb:6,au:4};
function metFor(name){const n=norm(name);for(const [re,m] of MET_RULES)if(re.test(n))return m;return MET_BY_CODE[codeOf(name)]||4}
const bwOf=()=>(S.settings&&S.settings.bw)||75, tempoOf=()=>(S.settings&&S.settings.tempo)||3;
function kcalFor(name,totalReps,bw,tp){return metFor(name)*3.5*(bw||bwOf())/200*(totalReps*(tp||tempoOf())/60)}

/* écritures différées, une à la fois par document */
function makeWriter(fn,delay){let t=null,busy=false,dirty=false;
  const run=async()=>{if(busy){dirty=true;return}busy=true;try{await fn();if(S.sync==='error')setSync('live')}catch(e){setSync('error')}busy=false;if(dirty){dirty=false;run()}};
  return ()=>{clearTimeout(t);t=setTimeout(run,delay)}}
const W={
  app:makeWriter(async()=>{if(!S.refs)return;await S.refs.app.set({templates:S.templates,settings:S.settings,updatedAt:Date.now()})},500),
  active:makeWriter(async()=>{if(!S.refs)return;await S.refs.active.set({session:S.active||null,updatedAt:Date.now()})},700)
};
const saveApp=()=>{cache();W.app()};
const saveActive=()=>{cache();W.active()};
async function pushSession(rec){const i=S.sessions.findIndex(s=>s.id===rec.id);if(i>=0)S.sessions[i]=rec;else S.sessions.push(rec);S.sessions.sort((a,b)=>b.startedAt-a.startedAt);cache();if(S.refs){try{await S.refs.sessions.doc(rec.id).set(rec)}catch(e){setSync('error')}}}
async function dropSession(id){S.sessions=S.sessions.filter(s=>s.id!==id);cache();if(S.refs){try{await S.refs.sessions.doc(id).delete()}catch(e){setSync('error')}}}
function setSync(v){S.sync=v;const d=$('#syncdot');d.className='dot'+(v==='live'?' live':v==='error'?' err':'');d.title=v==='live'?'Synchronisé':v==='error'?'Erreur de synchronisation':'Stockage local';if(S.tab==='set')paint()}

/* connexion à la base partagée (données privées de l'utilisateur) */
async function connect(){
  if(!window.claude||!window.claude.use){setSync('local');return}
  let user=null,db=null;
  try{[user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')])}catch(e){}
  try{S.downloads=await window.claude.use('downloads')}catch(e){}
  if(!user||!db){setSync('local');return}
  let id=null;try{id=await user.id()}catch(e){}
  if(!id){setSync('local');return}
  S.uid=id;S.db=db;const base='data/users/'+id;
  S.refs={app:db.doc(base+'/app'),active:db.doc(base+'/active'),sessions:db.collection(base+'/log/sessions')};
  const onErr=()=>setSync('error');
  S.refs.app.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists){const d=snap.data()||{};S.templates=clone(d.templates||[]);S.settings={...DEF_SET,...clone(d.settings||{})};fixSettings();cache();setSync('live');paint()}
    else if(!snap.metadata.fromCache){if(S.templates.length)W.app();setSync('live')}
  },onErr);
  S.refs.active.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists){const d=snap.data()||{};const s=d.session?clone(d.session):null;if(JSON.stringify(s)!==JSON.stringify(S.active)){S.active=s;S.ui.open=undefined;cache();paint();refreshFab()}}
    else if(!snap.metadata.fromCache&&S.active)W.active();
  },onErr);
  let migrated=false;
  S.refs.sessions.orderBy('startedAt','desc').limit(1000).onSnapshot(snap=>{
    const remote=snap.docs.map(d=>clone(d.data()));
    if(snap.metadata.fromCache&&!remote.length)return;
    if(!snap.metadata.fromCache&&!migrated){migrated=true;if(!remote.length&&S.sessions.length){S.sessions.slice(0,300).forEach(s=>{S.refs.sessions.doc(s.id).set(s).catch(()=>{})});return}}
    S.sessions=remote;cache();setSync('live');paint();
  },onErr);
}

/* ───────── Spring (skill Apple design) ───────── */
class Spring{
  constructor(v=0){this.x=v;this.v=0;this.target=v;this.damping=1;this.response=.4;this.raf=0;this.last=0;this.onUpdate=()=>{};this.onRest=()=>{}}
  to(t,{velocity=this.v,damping=1,response=.4}={}){this.target=t;this.v=velocity;this.damping=damping;this.response=response;if(this.raf)return;this.last=performance.now();
    const frame=now=>{const dt=Math.min((now-this.last)/1000,1/30);this.last=now;this.step(dt);
      if(Math.abs(this.x-this.target)<.1&&Math.abs(this.v)<1){this.x=this.target;this.v=0;this.raf=0;this.onUpdate(this.x);this.onRest();return}
      this.raf=requestAnimationFrame(frame)};this.raf=requestAnimationFrame(frame)}
  step(dt){const w=2*Math.PI/this.response,k=w*w,c=2*this.damping*w;const n=Math.max(1,Math.ceil(dt*240)),h=dt/n;
    for(let i=0;i<n;i++){this.v+=(-k*(this.x-this.target)-c*this.v)*h;this.x+=this.v*h}this.onUpdate(this.x)}
  stop(){cancelAnimationFrame(this.raf);this.raf=0}
}
const project=(v,d=.998)=>(v/1000)*d/(1-d);
const rubberband=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));

/* ───────── Feuilles ───────── */
const sheetStack=[];
function openSheet(opts){
  const wrap=document.createElement('div');wrap.className='sheet-wrap';
  const H=Math.round(opts.tall===false?Math.min(innerHeight*.62,520):Math.min(innerHeight*.92,innerHeight-50));
  wrap.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(opts.title||'')}" style="height:${H+120}px"><div class="drag"><div class="grab"></div><div class="sheet-h"><div class="l"></div><h2></h2><div class="r"></div></div></div><div class="sheet-body${opts.flush?' flush':''}"></div></div>`;
  const sheet=$('.sheet',wrap),scrim=$('.scrim',wrap),body=$('.sheet-body',wrap),drag=$('.drag',wrap);
  const prevFocus=document.activeElement;
  const below=sheetStack[sheetStack.length-1];
  if(below)below.wrap.inert=true;else $('#app').inert=true;
  const spring=new Spring(H);
  const apply=y=>{sheet.style.transform=`translateY(${y}px)`;scrim.style.opacity=clamp(1-y/H,0,1)};
  spring.onUpdate=apply;apply(H);document.body.appendChild(wrap);
  let closed=false;
  const ctx={body,wrap,
    setTitle(t){$('h2',wrap).textContent=t},
    setLeft(label,fn){const l=$('.l',wrap);l.innerHTML=label?`<button class="txt muted">${esc(label)}</button>`:'';if(label)l.firstChild.onclick=fn||(()=>ctx.close())},
    setRight(label,fn,disabled){const r=$('.r',wrap);r.innerHTML=label?`<button class="txt bold"${disabled?' disabled':''}>${esc(label)}</button>`:'';if(label)r.firstChild.onclick=fn},
    close(v){if(closed)return;closed=true;
      const done=()=>{wrap.remove();const i=sheetStack.indexOf(ctx);if(i>=0)sheetStack.splice(i,1);
        const top=sheetStack[sheetStack.length-1];if(top)top.wrap.inert=false;else $('#app').inert=false;
        try{prevFocus&&prevFocus.focus&&prevFocus.focus()}catch(e){}
        opts.onClose&&opts.onClose(v)};
      if(reduceMotion){done();return}

    rerender(){opts.build(ctx)}
  };
  ctx.wrap=wrap;sheetStack.push(ctx);
  ctx.setTitle(opts.title||'');ctx.setLeft(opts.left===undefined?'Fermer':opts.left);
  opts.build(ctx);
  if(reduceMotion){spring.x=0;apply(0)}else spring.to(0,{damping:1,response:.42});
  scrim.addEventListener('click',()=>ctx.close());
  /* geste de glissement : suit le doigt, reprend la vitesse au relâchement */
  let hist=[],startY=0,startX0=0,dragging=false;
  drag.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;spring.stop();startY=e.clientY;startX0=spring.x;hist=[{y:e.clientY,t:performance.now()}];drag.setPointerCapture(e.pointerId)});
  drag.addEventListener('pointermove',e=>{if(!dragging)return;let y=startX0+(e.clientY-startY);if(y<0)y=-rubberband(-y,H);spring.x=y;apply(y);hist.push({y:e.clientY,t:performance.now()});if(hist.length>12)hist.shift()});
  const end=()=>{if(!dragging)return;dragging=false;const now=performance.now();const rec=hist.filter(p=>now-p.t<=100);let v=0;
    if(rec.length>1){const a=rec[0],b=rec[rec.length-1];if(b.t>a.t)v=(b.y-a.y)/(b.t-a.t)*1000}
    const projected=spring.x+project(v);

  drag.addEventListener('pointerup',end);drag.addEventListener('pointercancel',end);
  setTimeout(()=>{const f=body.querySelector('[data-autofocus]');if(f)f.focus()},350);
  return ctx;
}

  if(gym)for(const s of S.sessions){if(s.gym!==gym)continue;const x=pick(s);if(x){e=x;src=s;break}}

  if(e){const bs=e.bisSets||[];const mw=exWeights(e).filter((_,i)=>!bs.includes(i));const varied=mw.some(w=>w!==mw[0]);return{weight:mw.length?mw[0]:e.weight,weights:varied?mw:null,reps:e.reps,gym:src.gym||null}}

      :`<div class="set"><div class="set-top"><div class="set-n">Série ${j+1}<small>objectif ${e.reps}</small></div><div class="stepper"><button class="chip" style="min-width:40px;padding:0" data-a="r" data-i="${i}" data-j="${j}" data-v="-1" aria-label="Moins une répétition">−</button><input class="reps-in" data-i="${i}" data-j="${j}" inputmode="numeric" value="${s.reps}" aria-label="Répétitions"></div><button class="check" data-a="done" data-i="${i}" data-j="${j}" aria-label="Valider la série ${j+1}">${I.check}</button></div><div class="set-chips">${[1,2,3,4].map(v=>`<button class="chip" data-a="r" data-i="${i}" data-j="${j}" data-v="${v}">+${v}</button>`).join('')}</div>${e.perSet?`<div class="pw-row"><button class="chip" data-a="pw" data-i="${i}" data-j="${j}" data-v="-5" aria-label="Moins 5 kilos">−5</button><button class="chip" data-a="pw" data-i="${i}" data-j="${j}" data-v="-2.5" aria-label="Moins 2,5 kilos">−2,5</button><div class="pw-val${s.w!=null?' ov':''}"><input class="pw-in" data-i="${i}" data-j="${j}" inputmode="decimal" value="${fmtN(w)}" aria-label="Poids de la série ${j+1} en kilos"><span>kg</span></div><button class="chip" data-a="pw" data-i="${i}" data-j="${j}" data-v="2.5" aria-label="Plus 2,5 kilos">+2,5</button><button class="chip" data-a="pw" data-i="${i}" data-j="${j}" data-v="5" aria-label="Plus 5 kilos">+5</button></div><div class="pw-auto">${s.w!=null?`Poids perso pour cette série · <button data-a="pwreset" data-i="${i}" data-j="${j}">revenir au général</button>`:'Suit le poids général'}</div>`:''}</div>`)+bisBlock(e,i,j,s)}).join('');
    body+=`<div class="opts" role="group" aria-label="Options de l’exercice">
      <button class="opt${fav?' on':''}" data-a="fav" data-i="${i}" aria-pressed="${fav}">${fav?I.star.replace('<svg','<svg style="fill:currentColor"'):I.star}<span>Favori</span></button>
      <button class="opt${e.perSet?' on':''}" data-a="vary" data-i="${i}" aria-pressed="${!!e.perSet}">${I.vary}<span>Poids par série</span></button>
      <button class="opt" data-a="addset" data-i="${i}">${I.plus}<span>Série</span></button></div>
      <div class="ex-foot"><button class="txt muted" data-a="rmex" data-i="${i}">Retirer l'exercice</button></div></div>`;
  }
  const fin=done===n&&n>0;
  return `<section class="card ex${open?' open':''}${fin?' complete':''}"><button class="ex-h" data-a="toggle" data-i="${i}" aria-expanded="${open}"><div class="grow"><div class="step">Exercice ${i+1} sur ${total}${e.bis?' · bis':''}${fin?' · terminé':''}</div><div class="ex-name">${esc(e.name)}${fav?' <span class="favmark" aria-label="favori">★</span>':''}</div><div class="s">${e.setsData.length} × ${e.reps} · ${esc(prev)}</div><div class="kc">${done?'':'≈ '}${fmtN(kc,1)} kcal${done?'':' prévues'}</div></div><span class="badge${fin?' ok':''}">${done}/${n}</span>${I.chev}</button>${body}</section>`;
}
const kcalSession=s=>sum(s.exercises.map(e=>kcalFor(e.name,sum(e.reps),s.bw,s.tempo)));
function swCard(a,nSets,nDone){
  const el=restElapsed(a),idle=!a.restRun&&el===0,target=S.settings.rest;
  const label=a.restRun?'Stop':(el>0?'Relancer':'Lancer');
  const vol=sum(a.exercises.map(e=>sum(doneList(e).map(x=>x.w*x.r))));
  const kc=sum(a.exercises.map(e=>kcalFor(e.name,sum(doneList(e).map(x=>x.r)))));
  return `<div class="card stopwatch${el/1000>=target?' over':''}">
    <div class="sec" style="margin:0">Repos entre les séries</div>
    <div class="ring-wrap"><svg class="ring" viewBox="0 0 220 220" aria-hidden="true"><circle class="ring-bg" cx="110" cy="110" r="96"/><circle id="ringp" class="ring-fg" cx="110" cy="110" r="96" transform="rotate(-90 110 110)" stroke-dasharray="${RING_C.toFixed(2)}" stroke-dashoffset="${(RING_C*(1-Math.min(el/1000/target,1))).toFixed(1)}"/></svg>
      <div class="ring-c"><div class="ring-time" id="rest" role="timer"><span id="rest-m">${fmtCs(el)[0]}</span><span class="cs" id="rest-cs">${fmtCs(el)[1]}</span></div><div class="ring-sub">objectif ${fmtDur(target)}</div></div></div>
    <div class="sw-btns"><button class="sw-btn gray" data-a="rest-reset"${idle?' disabled':''}>Reset</button><button class="sw-btn ${a.restRun?'stop':'go'}" data-a="rest-main">${label}</button></div>
    <div class="sw-stats"><div><b>${fmtN(kc,1)}</b><span>kcal dépensées</span></div><div><b>${nDone}/${nSets}</b><span>séries</span></div><div><b>${Math.round(vol)}</b><span>kg soulevés</span></div></div>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${nSets}" aria-valuenow="${nDone}"><i style="width:${nSets?nDone/nSets*100:0}%"></i></div></div>`;
}
function renderTrain(){

      ${last?`<div class="sec">Dernière séance</div><button class="card sess" data-a="open-sess" data-id="${last.id}"><div class="top"><span class="nm">${esc(last.name)}</span><span class="time">${fmtClock(last.startedAt)}</span></div><div class="meta"><span>${dShort.format(last.startedAt)}</span><span>${fmtDurLong(last.duration)}</span><span>${sum(last.exercises.map(e=>e.reps.length))} séries</span><span class="kc">${Math.round(kcalSession(last))} kcal</span></div></button>`:''}</div>`;

    ${a.exercises.length?a.exercises.map((e,i)=>exCard(e,i,S.ui.open===i,a.exercises.length)).join(''):`<div class="card empty"><b>Séance vide</b>Ajoute ton premier exercice.</div>`}
    <button class="add-row" data-a="addex">${I.plus}<span>Ajouter un exercice</span></button>
    <div class="divider"></div>
    <button class="btn primary block" data-a="finish">Terminer la séance</button>

function fmtVolParts(kg){return kg>=1000?`${fmtN(kg/1000,1)}<small>t</small>`:`${Math.round(kg)}<small>kg</small>`}
const sessionVol=s=>sum(s.exercises.map(exVol));

function trainAction(act,d){
  const a=S.active;
  switch(act){
    case 'to-plan':go('plan');return;
    case 'start':if(S.templates.length)openPicker();else{go('plan');openEditor(null)}return;
    case 'open-sess':openSession(d.id);return;
  }
  if(!a)return;
  const i=+d.i,j=+d.j,e=a.exercises[i];
  switch(act){
    case 'toggle':S.ui.open=S.ui.open===i?-1:i;break;
    case 'w':e.weight=Math.max(0,Math.round((e.weight+ +d.v)*100)/100);break;
    case 'r':{const s=e.setsData[j];s.reps=Math.max(0,s.reps+ +d.v);break}
    case 'done':{const st=e.setsData[j];st.w=e.perSet&&st.w!=null?st.w:e.weight;st.done=true;startRest(a);if(navigator.vibrate)navigator.vibrate(10);
      if(fullyDone(e)){const k=a.exercises.findIndex(x=>!fullyDone(x));S.ui.open=k<0?-1:k}break}
    case 'undo':{const st=e.setsData[j];st.done=false;if(!e.perSet||st.w===e.weight)delete st.w;break}
    case 'pwreset':delete e.setsData[j].w;break;
    case 'gym':openGymPicker(a.gym,name=>{a.gym=name;a.exercises.forEach(x=>{if(doneList(x).length)return;const p=lastPerf(x.name,name);x.prev=p;x.weight=p?p.weight:x.weight;x.setsData.forEach(st=>{delete st.w});x.perSet=!!(p&&p.weights);if(x.perSet)x.setsData.forEach((st,k)=>{const pw=p.weights[Math.min(k,p.weights.length-1)];if(pw!==p.weight)st.w=pw})});saveActive();paint()});return;
    case 'pw':{const st=e.setsData[j];setW(e,j,Math.max(0,Math.round(((st.w!=null?st.w:e.weight)+ +d.v)*100)/100));break}
    case 'vary':{e.perSet=!e.perSet;
      /* le poids général ne bouge jamais : seules les séries modifiées gardent un poids perso */
      if(!e.perSet)e.setsData.forEach(st=>{if(!st.done)delete st.w});
      break}
    case 'fav':toggleFav({name:e.name,group:e.group});toast(isFav(e.name)?'Ajouté aux favoris':'Retiré des favoris');break;
    case 'bisadd':{const st=e.setsData[j];st.bis={reps:st.reps,w:st.w!=null?st.w:e.weight,done:false};break}
    case 'bisrm':delete e.setsData[j].bis;if(fullyDone(e)){const k=a.exercises.findIndex(x=>!fullyDone(x));S.ui.open=k<0?-1:k}break;
    case 'bisr':{const b=e.setsData[j].bis;b.reps=Math.max(0,b.reps+ +d.v);break}
    case 'bispw':{const b=e.setsData[j].bis;b.w=Math.max(0,Math.round((b.w+ +d.v)*100)/100);break}
    case 'bisundo':e.setsData[j].bis.done=false;break;
    case 'bisdone':{e.setsData[j].bis.done=true;startRest(a);if(navigator.vibrate)navigator.vibrate(10);
      if(fullyDone(e)){const k=a.exercises.findIndex(x=>!fullyDone(x));S.ui.open=k<0?-1:k}break}
    case 'addset':{const last=e.setsData[e.setsData.length-1];const ns={reps:last?last.reps:e.reps,done:false};if(e.perSet&&last&&last.w!=null)ns.w=last.w;e.setsData.push(ns);break}
    case 'rmex':a.exercises.splice(i,1);S.ui.open=undefined;break;
    case 'rest-main':restMain(a);break;
    case 'rest-reset':a.restRun=false;a.restAcc=0;a.restStart=0;a.alerted=false;Push.cancel();break;
    case 'addex':openCatalog({title:'Ajouter des exercices',onAdd:it=>addLiveEx(it)});return;
    case 'finish':openFinish();return;
    case 'abandon':confirmSheet({title:'Abandonner la séance ?',message:'Les séries déjà validées ne seront pas enregistrées.',label:'Abandonner la séance',onConfirm:()=>{S.active=null;saveActive();Push.cancel();paint();toast('Séance abandonnée')}});return;
    default:return;
  }
  saveActive();paint();
}
function startRest(a){a.restRun=true;a.restAcc=0;a.restStart=Date.now();a.alerted=false;Push.planRest(0)}
function restMain(a){if(a.restRun){a.restAcc=restElapsed(a);a.restRun=false;Push.cancel()}else{a.restRun=true;a.restStart=Date.now();Push.planRest(a.restAcc/1000)}}
function openGymPicker(cur,onPick){
  openSheet({title:'Salle de sport',tall:false,left:'Annuler',build(ctx){
    const gs=S.settings.gyms||[];
    ctx.body.innerHTML=`<div class="group">${gs.map(g=>`<button class="row" data-g="${esc(g.name)}"><span class="radio${g.name===cur?' on':''}"></span><div class="grow t">${esc(g.name)}</div></button>`).join('')}<button class="row" data-g=""><span class="radio${!cur?' on':''}"></span><div class="grow t">Sans salle</div></button></div><p class="s" style="margin:10px 4px 0">Ajoute ou retire des salles dans Réglages.</p>`;
    ctx.body.onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;ctx.close();onPick(b.dataset.g||null)};
  }});
}
function openFinish(){
  const a=S.active;
  openSheet({title:'Terminer la séance',tall:false,left:'Continuer',build(ctx){
    const rec=buildRecord();const nDone=sum(rec.exercises.map(e=>e.reps.length)),nAll=sum(a.exercises.map(e=>allList(e).length));
    ctx.body.innerHTML=`<div class="stat-row three" style="margin-top:6px"><div class="card stat"><div class="v">${fmtDur(rec.duration)}</div><div class="k">durée</div></div><div class="card stat"><div class="v">${fmtVolParts(sessionVol(rec))}</div><div class="k">volume</div></div><div class="card stat"><div class="v">${fmtN(kcalSession(rec),1)}<small>kcal</small></div><div class="k">dépensées</div></div></div>
      <p class="s" style="text-align:center;margin:14px 8px 0">Calories calculées sur le temps sous tension, hors effet EPOC (+5 à 12 % du métabolisme de repos pendant 24 à 48 h après une séance lourde).</p><p class="sub" style="text-align:center;margin:12px 0 18px">${nDone} série${nDone>1?'s':''} validée${nDone>1?'s':''} sur ${nAll}${nDone<nAll?' · les autres seront ignorées':''}</p>
      ${nDone?`<button class="btn primary block" data-save>Enregistrer la séance</button>`:`<p class="sub" style="text-align:center;color:var(--accent)">Valide au moins une série pour enregistrer.</p>`}`;
    const b=ctx.body.querySelector('[data-save]');if(b)b.onclick=async()=>{const r=buildRecord();S.active=null;saveActive();Push.cancel();ctx.close();await pushSession(r);Push.sync().catch(()=>{});S.ui.calSel=dayKey(r.startedAt);paint();toast('Séance enregistrée');};
  }});
}
function buildRecord(){const a=S.active,end=Date.now();
  return{id:a.id,tplId:a.tplId||null,name:a.name,...(a.gym?{gym:a.gym}:{}),startedAt:a.startedAt,endedAt:end,bw:bwOf(),tempo:tempoOf(),duration:Math.round((end-a.startedAt)/1000),
    exercises:a.exercises.map(e=>{const reps=[],ws=[],bisSets=[];
      e.setsData.forEach(st=>{if(st.done){reps.push(st.reps);ws.push(st.w!=null?st.w:e.weight)}
        if(st.bis&&st.bis.done){bisSets.push(reps.length);reps.push(st.bis.reps);ws.push(st.bis.w)}});
      const varied=ws.some(w=>w!==ws[0]);
      return{name:e.name,group:e.group||groupOf(e.name),weight:ws.length?ws[0]:e.weight,...(varied?{weights:ws}:{}),...(bisSets.length?{bisSets}:{}),...(e.bis?{bis:true}:{}),reps}}).filter(e=>e.reps.length)}}

/* ───────── Catalogue (feuille de recherche) ───────── */
function openCatalog({title,onAdd,onClose}){
  const added=new Set();let q='',grp='Tous',por='',typ='',eqf='';
  openSheet({title,left:null,flush:true,onClose,build(ctx){
    ctx.setRight('Terminé',()=>ctx.close());
    ctx.body.innerHTML=`<div style="padding:4px 16px 0"><label class="search">${I.search}<input type="search" placeholder="Rechercher parmi ${CATALOG.length} exercices" aria-label="Rechercher un exercice" data-autofocus></label></div><div class="chips-scroll" role="group" aria-label="Groupe musculaire">${['Tous',...GROUPS.filter(g=>g!=='Autre')].map(g=>`<button class="chip${g===grp?' on':''}" data-g="${g}">${g}</button>`).join('')}</div><div class="chips-scroll sub" id="cat-por" role="group" aria-label="Portion du muscle"></div><div class="chips-scroll sub" id="cat-f" role="group" aria-label="Type et matériel"></div><div id="cat-res" style="padding:0 16px"></div>`;
    const res=$('#cat-res',ctx.body);
    const drawChips=()=>{
      const pc=$('#cat-por',ctx.body),ps=PORTIONS[grp];
      pc.hidden=!ps;pc.innerHTML=ps?`<span class="chips-lbl">Portion</span>`+['',...ps].map(p=>`<button class="chip${p===por?' on':''}" data-por="${esc(p)}">${p?esc(p):'Toutes'}</button>`).join(''):'';
      const eqs=[...new Set(CATALOG.map(c=>c.eq))];
      $('#cat-f',ctx.body).innerHTML=`<span class="chips-lbl">Filtre</span>`+['Polyarticulaire','Isolation'].map(t=>`<button class="chip${t===typ?' on':''}" data-typ="${t}">${t}</button>`).join('')+eqs.map(x=>`<button class="chip${x===eqf?' on':''}" data-eqf="${esc(x)}">${esc(x)}</button>`).join('');
    };
    drawChips();
    const draw=()=>{
      const nq=norm(q.trim());
      const favs=S.settings.favs||[],favSet=new Set(favs.map(f=>f.name));
      const match=c=>(grp==='Tous'||c.group===grp)&&(!por||c.portion===por)&&(!typ||c.type===typ)&&(!eqf||c.eq===eqf)&&(!nq||nq.split(/\s+/).every(w=>c.n.includes(w)));
      const extra=favs.filter(f=>!CATALOG.some(c=>c.name===f.name)).map(f=>({name:f.name,group:f.group||'Autre',eq:'Libre',n:norm(f.name)})).filter(match);
      const all=[...extra,...CATALOG.filter(match)];
      const exact=all.some(c=>c.n===nq);
      const favL=all.filter(c=>favSet.has(c.name)),rest=all.filter(c=>!favSet.has(c.name));
      const total=rest.length,shown=rest.slice(0,80);
      const tick=`<span class="check" style="width:28px;height:28px;background:var(--accent);border-color:var(--accent);color:#fff">${I.check.replace('<svg','<svg style="width:16px;height:16px"')}</span>`;
      const rowH=c=>{const f=favSet.has(c.name);return `<div class="row split"><button class="row-main" data-n="${esc(c.name)}" data-g2="${esc(c.group)}"><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.group)} · ${esc(c.eq)}</div>${c.joints?`<div class="tagline">${c.portion?`<span class="tg p">${esc(c.portion)}</span>`:''}<span class="tg">${esc(c.type)} · ${esc(c.joints.join(' + '))}</span><span class="tg k">≈ ${fmtN(kcalFor(c.name,10),1)} kcal / 10 reps</span></div>`:''}</div>${added.has(c.name)?tick:I.plus}</button><button class="star${f?' on':''}" data-fav="${esc(c.name)}" data-g2="${esc(c.group)}" aria-pressed="${f}" aria-label="${f?'Retirer des favoris':'Ajouter aux favoris'} : ${esc(c.name)}">${I.star}</button></div>`};
      let html='';
      if(q.trim()&&!exact)html+=`<div class="group" style="margin-bottom:12px"><button class="row" data-new><div class="grow"><div class="t">Créer « ${esc(q.trim())} »</div><div class="s">Exercice libre · groupe ${grp==='Tous'?'Autre':grp}</div></div>${I.plus}</button></div>`;
      if(favL.length)html+=`<div class="sec" style="margin-top:6px">Favoris</div><div class="group">${favL.map(rowH).join('')}</div>`;
      if(shown.length)html+=`${favL.length?'<div class="sec">Tous les exercices</div>':''}<div class="group">${shown.map(rowH).join('')}</div>${total>80?`<p class="s" style="text-align:center;margin:12px">${total-80} autres résultats : affine ta recherche</p>`:''}`;
      else if(!favL.length&&!q.trim())html+=`<div class="empty">Aucun exercice.</div>`;
      res.innerHTML=html;
    };
    draw();
    ctx.body.addEventListener('input',e=>{if(e.target.matches('input[type=search]')){q=e.target.value;draw()}});
    ctx.body.addEventListener('click',e=>{
      const g=e.target.closest('[data-g]');if(g){grp=g.dataset.g;por='';ctx.body.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',b.dataset.g===grp));drawChips();draw();return}
      const pb=e.target.closest('[data-por]');if(pb){por=pb.dataset.por;drawChips();draw();return}
      const tb=e.target.closest('[data-typ]');if(tb){typ=typ===tb.dataset.typ?'':tb.dataset.typ;drawChips();draw();return}
      const eb=e.target.closest('[data-eqf]');if(eb){eqf=eqf===eb.dataset.eqf?'':eb.dataset.eqf;drawChips();draw();return}
      const nw=e.target.closest('[data-new]');if(nw){const name=q.trim();const it={name,group:grp==='Tous'?'Autre':grp,eq:'Libre'};added.add(name);onAdd(it);toast('Ajouté : '+name);draw();return}
      const st=e.target.closest('[data-fav]');if(st){toggleFav({name:st.dataset.fav,group:st.dataset.g2});draw();return}
      const r=e.target.closest('[data-n]');if(r){const name=r.dataset.n;if(added.has(name))return;const it=CATALOG.find(c=>c.name===name)||{name,group:r.dataset.g2||'Autre',eq:'Libre'};added.add(name);onAdd(it);toast('Ajouté : '+name);draw()}
    });
  }});
}

function renderPlan(){
  const el=$('#s-plan');
  el.innerHTML=`<div class="col"><div class="titlerow"><h1 class="large">Programme</h1><button class="icon-btn accent" data-a="new" aria-label="Nouvelle séance">${I.plus}</button></div>
    <div class="sec" style="margin-top:0">Mes séances</div>

}
function openEditor(id){
  const existing=id?S.templates.find(t=>t.id===id):null;
  const draft=existing?clone(existing):{id:uid8(),name:'',exercises:[]};
  openSheet({title:existing?'Modifier la séance':'Nouvelle séance',left:'Annuler',build(ctx){
    const valid=()=>draft.name.trim()&&draft.exercises.length;
    const draw=()=>{
      ctx.setRight('Enregistrer',()=>{draft.name=draft.name.trim();const i=S.templates.findIndex(t=>t.id===draft.id);if(i>=0)S.templates[i]=draft;else S.templates.push(draft);saveApp();ctx.close();paint();toast('Séance enregistrée')},!valid());
      const rows=draft.exercises.map((e,i)=>`<div class="row" style="flex-wrap:wrap;gap:8px 12px"><div class="grow" style="flex-basis:60%"><div class="t">${esc(e.name)}</div><div class="s">${esc(e.group||'')}</div></div>${i>0?`<button class="icon-btn" style="width:36px;height:36px" data-a="up" data-i="${i}" aria-label="Monter">${I.up}</button>`:''}<button class="txt muted" data-a="del" data-i="${i}" style="padding:0 6px;min-height:36px">Retirer</button>
        <div style="display:flex;gap:18px;width:100%;justify-content:space-between"><div class="mini-step"><span class="s">Séries</span><button data-a="s-" data-i="${i}" aria-label="Moins de séries">−</button><b>${e.sets}</b><button data-a="s+" data-i="${i}" aria-label="Plus de séries">+</button></div><div class="mini-step"><span class="s">Reps</span><button data-a="r-" data-i="${i}" aria-label="Moins de répétitions">−</button><b>${e.reps}</b><button data-a="r+" data-i="${i}" aria-label="Plus de répétitions">+</button></div></div></div>`).join('');
      ctx.body.innerHTML=`<div class="group"><label class="field"><input data-name value="${esc(draft.name)}" placeholder="Nom : Séance 2, Dos, Push…" maxlength="40" aria-label="Nom de la séance" ${draft.name?'':'data-autofocus'}></label></div>
        <div class="sec">Exercices</div>${draft.exercises.length?`<div class="group">${rows}</div>`:''}
        <button class="add-row" data-a="add">${I.plus}<span>Ajouter un exercice</span></button>
        ${existing?`<div class="divider"></div><button class="txt" style="width:100%" data-a="rm">Supprimer la séance</button>`:''}`;
    };
    draw();
    ctx.body.oninput=e=>{if(e.target.matches('[data-name]')){draft.name=e.target.value;const r=$('.r button',ctx.wrap);if(r)r.disabled=!valid()}};
    ctx.body.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.dataset.i,a=b.dataset.a,x=draft.exercises[i];
      if(a==='add'){openCatalog({title:'Ajouter des exercices',onAdd:it=>{draft.exercises.push(mkEx(it))},onClose:()=>draw()});return}
      if(a==='rm'){confirmSheet({title:'Supprimer la séance ?',message:'Les séances déjà enregistrées dans le calendrier sont conservées.',label:'Supprimer',onConfirm:()=>{S.templates=S.templates.filter(t=>t.id!==draft.id);saveApp();ctx.close();paint();toast('Séance supprimée')}});return}
      if(a==='up'){[draft.exercises[i-1],draft.exercises[i]]=[draft.exercises[i],draft.exercises[i-1]]}
      else if(a==='del')draft.exercises.splice(i,1);
      else if(a==='s-')x.sets=Math.max(1,x.sets-1);else if(a==='s+')x.sets=Math.min(12,x.sets+1);
      else if(a==='r-')x.reps=Math.max(1,x.reps-1);else if(a==='r+')x.reps=Math.min(50,x.reps+1);
      draw()};
  }});
}

/* ───────── Calendrier ───────── */
function renderCal(){
  const el=$('#s-cal'),now=new Date();
  if(S.ui.calY==null){S.ui.calY=now.getFullYear();S.ui.calM=now.getMonth()}
  if(!S.ui.calSel)S.ui.calSel=dayKey(Date.now());
  const y=S.ui.calY,m=S.ui.calM,first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  const byDay={};S.sessions.forEach(s=>{(byDay[dayKey(s.startedAt)]=byDay[dayKey(s.startedAt)]||[]).push(s)});
  const monthCount=S.sessions.filter(s=>{const d=new Date(s.startedAt);return d.getFullYear()===y&&d.getMonth()===m}).length;
  const today=dayKey(Date.now());
  let cells=['L','M','M','J','V','S','D'].map(d=>`<div class="cal-dow" aria-hidden="true">${d}</div>`).join('');

    <div class="card cal-grid">${cells}</div>

}

/* ───────── Graphiques (SVG) ───────── */
let gid=0;
function lineChart(pts,{h=170}={}){
  if(!pts.length)return '<div class="empty">Pas encore de données</div>';
  const W=320,H=h,pl=34,pr=12,pt=14,pb=24;
  let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x));if(x0===x1){x0-=864e5;x1+=864e5}
  let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));const py=(y1-y0)*.18||Math.max(1,y1*.12);y0=Math.max(0,y0-py);y1+=py;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  const id='g'+(++gid);
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=line+` L${X(pts[pts.length-1].x).toFixed(1)} ${H-pb} L${X(pts[0].x).toFixed(1)} ${H-pb} Z`;
  const grid=[y0,(y0+y1)/2,y1].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(255,255,255,.07)"/><text x="${pl-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${fmtN(v,y1>50?0:1)}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'#FF2D2D':'#0D0D0E'}" stroke="#FF2D2D" stroke-width="1.6"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution, de ${fmtN(pts[0].y,1)} à ${fmtN(pts[pts.length-1].y,1)}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF2D2D" stop-opacity=".35"/><stop offset="1" stop-color="#FF2D2D" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="#FF2D2D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${pl}" y="${H-7}">${dShort.format(x0===pts[0].x?pts[0].x:pts[0].x)}</text><text x="${W-pr}" y="${H-7}" text-anchor="end">${dShort.format(pts[pts.length-1].x)}</text></svg>`;
}
function barChart(items,{h=150}={}){
  const W=320,H=h,pt=18,pb=22,max=Math.max(1,...items.map(i=>i.v));const bw=(W-20)/items.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogramme">${items.map((it,i)=>{const bh=it.v/max*(H-pt-pb);const x=10+i*bw+bw*.18,w=bw*.64,y=H-pb-bh;const last=i===items.length-1;
    return `<rect x="${x.toFixed(1)}" y="${(it.v?y:H-pb-2).toFixed(1)}" width="${w.toFixed(1)}" height="${(it.v?bh:2).toFixed(1)}" rx="4" fill="${last?'#FF2D2D':'#2A2A2A'}"/>${it.v?`<text x="${(x+w/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" style="fill:#E4E2DF">${fmtN(it.v,it.v>=100?0:1)}</text>`:''}<text x="${(x+w/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${esc(it.l)}</text>`}).join('')}</svg>`;
}
const PAL=['#FF2D2D','#8F1616','#C9C6C2','#8E8B87','#5E5C5A','#3A3A3A'];
function donut(items,centerTxt){
  const tot=sum(items.map(i=>i.v));if(!tot)return '<div class="empty">Pas encore de données</div>';
  items=items.slice().sort((a,b)=>b.v-a.v);
  if(items.length>6){const rest=items.slice(5);items=items.slice(0,5).concat([{l:'Autres',v:sum(rest.map(r=>r.v))}])}
  const r=48,C=2*Math.PI*r;let off=0;
  const segs=items.map((it,i)=>{const len=it.v/tot*C,gap=items.length>1?2:0;const s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${PAL[i]}" stroke-width="16" stroke-dasharray="${Math.max(0,len-gap).toFixed(2)} ${(C-Math.max(0,len-gap)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=len;return s}).join('');
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Répartition">${segs}<text x="60" y="58" text-anchor="middle" style="fill:#E4E2DF;font:700 15px 'Montserrat',sans-serif">${centerTxt}</text></svg><div class="legend">${items.map((it,i)=>`<div><i style="background:${PAL[i]}"></i><span>${esc(it.l)}</span><b>${Math.round(it.v/tot*100)} %</b></div>`).join('')}</div></div>`;
}

/* ───────── Statistiques ───────── */
function history(){
  const map=new Map();
  for(const s of S.sessions.slice().sort((a,b)=>a.startedAt-b.startedAt))for(const e of s.exercises){
    let m=map.get(e.name);if(!m){m={name:e.name,group:e.group,entries:[]};map.set(e.name,m)}
    m.entries.push({t:s.startedAt,w:exMaxW(e),reps:e.reps,vol:exVol(e),k:kcalFor(e.name,sum(e.reps),s.bw,s.tempo),e1:Math.max(...e.reps.map((r,i)=>e1rm(exWeights(e)[i],r))),mr:Math.max(...e.reps)})}
  return map;
}
function renderStats(){
  const el=$('#s-stats'),R=S.ui.range;
  const cut=R?Date.now()-R*864e5:0;
  const usedGyms=[...new Set(S.sessions.map(s=>s.gym).filter(Boolean))];
  if(S.ui.gymF&&!usedGyms.includes(S.ui.gymF))S.ui.gymF='';
  const gf=S.ui.gymF;
  const ss=S.sessions.filter(s=>s.startedAt>=cut&&(!gf||s.gym===gf));
  const nSets=sum(ss.map(s=>sum(s.exercises.map(e=>e.reps.length))));
  const vol=sum(ss.map(sessionVol));
  const avg=ss.length?sum(ss.map(s=>s.duration))/ss.length:0;
  const kc=sum(ss.map(kcalSession));
  if(!S.sessions.length){
    el.innerHTML=`<div class="col"><h1 class="large">Statistiques</h1><div class="card empty"><b>Rien à analyser pour l’instant</b>Enregistre ta première séance pour suivre ta surcharge progressive.</div></div>`;return;
  }
  const split=['vol','sets','kcal'].includes(S.ui.split)?S.ui.split:'vol';
  const byG={};ss.forEach(s=>s.exercises.forEach(e=>{byG[e.group]=(byG[e.group]||0)+(split==='vol'?exVol(e):split==='kcal'?kcalFor(e.name,sum(e.reps),s.bw,s.tempo):e.reps.length)}));
  const byS={};ss.forEach(s=>{byS[s.name]=(byS[s.name]||0)+1});
  const weeks=[];const w0=startOfWeek(Date.now());for(let i=7;i>=0;i--){const t=w0-i*7*864e5;weeks.push({t,l:dShort.format(t).replace(' ','\u00a0'),v:S.sessions.filter(s=>s.startedAt>=t&&s.startedAt<t+7*864e5&&(!gf||s.gym===gf)).length})}
  const hist=[...history().values()];
  const q=norm(S.ui.statSearch);
  el.innerHTML=`<div class="col"><h1 class="large">Statistiques</h1>
    <div class="seg" role="radiogroup" aria-label="Période">${[[30,'1 mois'],[90,'3 mois'],[0,'Tout']].map(([v,l])=>`<button role="radio" aria-checked="${R===v}" data-a="range" data-v="${v}">${l}</button>`).join('')}</div>
    ${usedGyms.length?`<div class="chips-scroll" style="padding:12px 0 0" role="group" aria-label="Salle">${['',...usedGyms].map(g=>`<button class="chip${g===gf?' on':''}" data-a="gymf" data-v="${esc(g)}">${g?esc(g):'Toutes les salles'}</button>`).join('')}</div>`:''}
    <div class="stat-row"><div class="card stat"><div class="v">${ss.length}</div><div class="k">séances</div></div><div class="card stat"><div class="v" style="color:var(--accent)">${Math.round(kc)}<small>kcal</small></div><div class="k">calories dépensées</div></div><div class="card stat"><div class="v">${fmtVolParts(vol)}</div><div class="k">volume total</div></div><div class="card stat"><div class="v">${nSets}</div><div class="k">séries</div></div><div class="card stat"><div class="v">${avg?fmtDurLong(avg):'–'}</div><div class="k">durée moyenne</div></div><div class="card stat"><div class="v">${ss.length?Math.round(kc/ss.length):'–'}<small>kcal</small></div><div class="k">par séance</div></div></div>
    <div class="sec">Répartition par muscle</div>
    <div class="seg" role="radiogroup" aria-label="Mesure" style="margin-bottom:10px">${[['vol','Volume'],['sets','Séries'],['kcal','Kcal']].map(([v,l])=>`<button role="radio" aria-checked="${split===v}" data-a="split" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="card">${donut(Object.entries(byG).map(([l,v])=>({l,v})),split==='vol'?fmtVol(vol):split==='kcal'?Math.round(kc)+' kcal':nSets+' séries')}</div>
    <div class="sec">Séances par type</div><div class="card">${donut(Object.entries(byS).map(([l,v])=>({l,v})),ss.length+' séances')}</div>
    <div class="sec">Régularité · séances par semaine</div><div class="card pad">${barChart(weeks.map(w=>({l:w.l,v:w.v})))}</div>
    <div class="sec">Progression par exercice</div>
    <label class="search" style="margin-bottom:10px">${I.search}<input type="search" id="st-q" placeholder="Filtrer les exercices" value="${esc(S.ui.statSearch)}" aria-label="Filtrer les exercices"></label>
    <div id="st-list"></div></div>`;
  drawStList(hist,q);
  $('#st-q').oninput=e=>{S.ui.statSearch=e.target.value;drawStList(hist,norm(e.target.value))};
}
function drawStList(hist,q){
  const list=hist.filter(h=>!q||norm(h.name).includes(q)).sort((a,b)=>b.entries.length-a.entries.length||a.name.localeCompare(b.name));
  $('#st-list').innerHTML=list.length?`<div class="group">${list.map(h=>{const f=h.entries[0],l=h.entries[h.entries.length-1];const d=l.w-f.w;
    return `<button class="row" data-a="ex" data-n="${esc(h.name)}"><div class="grow"><div class="t">${esc(h.name)}</div><div class="s">${l.w?fmtN(l.w)+' kg · ':''}${l.reps.join(' / ')} · ${h.entries.length} séance${h.entries.length>1?'s':''}</div></div>${h.entries.length>1&&d?`<span class="delta${d<0?' neg':''}">${d>0?'+':'−'}${fmtN(Math.abs(d))} kg</span>`:''}${I.chev}</button>`}).join('')}</div>`:`<div class="card empty">Aucun exercice.</div>`;
}
function openExercise(name){
  const h=history().get(name);if(!h)return;
  let metric=h.entries.some(e=>e.w>0)?'w':'mr';
  openSheet({title:name,left:'Fermer',build(ctx){
    const E=h.entries,hasW=E.some(e=>e.w>0);
    const defs={w:['Charge',e=>e.w,'kg'],e1:['1RM estimé',e=>e.e1,'kg'],v:['Volume',e=>e.vol,'kg'],mr:['Reps max',e=>e.mr,'reps'],k:['Calories',e=>e.k,'kcal']};
    const tabs=hasW?['w','e1','v','k']:['mr','k'];if(!tabs.includes(metric))metric=tabs[0];
    const pts=E.map(e=>({x:e.t,y:defs[metric][1](e)}));
    const best=k=>Math.max(...E.map(e=>defs[k][1](e)));
    ctx.body.innerHTML=`<div class="seg" role="radiogroup" aria-label="Mesure">${tabs.map(k=>`<button role="radio" aria-checked="${metric===k}" data-m="${k}">${defs[k][0]}</button>`).join('')}</div>
      <div class="card pad" style="margin-top:12px">${lineChart(pts)}</div>
      <div class="rec">${hasW?`<div class="card stat"><div class="v">${fmtN(best('w'))}</div><div class="k">record charge (kg)</div></div><div class="card stat"><div class="v">${fmtN(best('e1'),1)}</div><div class="k">1RM estimé (kg)</div></div><div class="card stat"><div class="v">${Math.round(best('v'))}</div><div class="k">volume max (kg)</div></div>`:`<div class="card stat"><div class="v">${best('mr')}</div><div class="k">reps max</div></div>`}</div>
      <div class="sec">Historique</div><div class="group">${E.slice().reverse().slice(0,15).map(e=>`<div class="row"><div class="grow"><div class="t">${dShort.format(e.t)}</div><div class="s">${e.w?fmtN(e.w)+' kg · ':''}${e.reps.join(' / ')} reps</div></div></div>`).join('')}</div>`;
    ctx.body.onclick=ev=>{const b=ev.target.closest('[data-m]');if(b){metric=b.dataset.m;ctx.rerender()}};
  }});
}

function gymBlock(){

  return `<div class="sec">Mes salles</div><div class="group">${gs.map(g=>{const n=S.sessions.filter(s=>s.gym===g.name).length,on=g.id===S.settings.gym;return `<div class="row split"><button class="row-main" data-a="gym-sel" data-id="${g.id}" aria-pressed="${on}"><span class="radio${on?' on':''}"></span><div class="grow"><div class="t">${esc(g.name)}</div><div class="s">${on?'Salle actuelle · ':''}${n} séance${n>1?'s':''}</div></div></button><button class="txt muted" style="padding:0 16px" data-a="gym-rm" data-id="${g.id}" aria-label="Retirer ${esc(g.name)}">Retirer</button></div>`}).join('')}

    <p class="s" style="margin:10px 4px 0">La salle choisie est enregistrée avec chaque séance. « Dernière fois » reprend d’abord les charges faites dans cette salle, car les machines changent d’une salle à l’autre.</p>`;
}
function addGym(){const i=$('#gym-new');const name=(i&&i.value||'').trim();if(!name)return;
  if(S.settings.gyms.some(g=>norm(g.name)===norm(name))){toast('Cette salle existe déjà');return}
  const g={id:uid8(),name};S.settings.gyms.push(g);S.settings.gym=g.id;saveApp();paint();toast('Salle ajoutée : '+name)}
async function exportData(){
  const data=JSON.stringify({app:'overload',v:1,exportedAt:new Date().toISOString(),templates:S.templates,sessions:S.sessions,settings:S.settings},null,2);
  const fn='overload-sauvegarde-'+dayKey(Date.now())+'.json';
  if(S.downloads){try{await S.downloads.save({filename:fn,data});return}catch(e){if(e&&e.code==='declined')return}}
  try{const b=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){toast('Export impossible')}
}
function importFile(f){if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{try{const d=JSON.parse(rd.result);let nt=0,ns=0;
    (d.templates||[]).forEach(t=>{if(t&&t.id&&Array.isArray(t.exercises)&&!S.templates.some(x=>x.id===t.id)){S.templates.push(t);nt++}});
    if(d.settings&&typeof d.settings==='object'){S.settings={...S.settings,...d.settings};fixSettings()}
    saveApp();
    for(const x of (d.sessions||[]))if(x&&x.id&&Array.isArray(x.exercises)&&!S.sessions.some(y=>y.id===x.id)){await pushSession(x);ns++}
    paint();toast(nt+' séance(s) et '+ns+' entraînement(s) importés')}catch(e){toast('Fichier invalide')}};
  rd.readAsText(f)}

  if(S.tab==='set'){
    if(a==='rest-'){S.settings.rest=Math.max(15,S.settings.rest-15);saveApp();paint()}
