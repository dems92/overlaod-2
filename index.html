    else if(a==='bw-'){S.settings.bw=Math.max(30,(S.settings.bw||75)-1);saveApp();paint()}
    else if(a==='bw+'){S.settings.bw=Math.min(250,(S.settings.bw||75)+1);saveApp();paint()}
    else if(a==='tp-'){S.settings.tempo=Math.max(1.5,(S.settings.tempo||3)-.5);saveApp();paint()}
    else if(a==='tp+'){S.settings.tempo=Math.min(8,(S.settings.tempo||3)+.5);saveApp();paint()}
    else if(a==='al-toggle'){S.settings.alertOn=S.settings.alertOn===false;saveApp();paint()}
    else if(a==='al-'||a==='al+'){S.settings.alert=clamp((S.settings.alert||150)+(a==='al+'?15:-15),30,900);saveApp();paint()}
    else if(a==='wg-toggle'){S.settings.widget=S.settings.widget===false;saveApp();paint()}
    else if(a==='wf-toggle'){S.settings.widgetFree=!S.settings.widgetFree;saveApp();paint()}
    else if(a==='gym-sel'){S.settings.gym=S.settings.gym===d.id?null:d.id;saveApp();paint()}
    else if(a==='gym-add')addGym()
    else if(a==='gym-rm'){const g=S.settings.gyms.find(x=>x.id===d.id);if(g)confirmSheet({title:'Retirer '+g.name+' ?',message:'Les séances déjà faites dans cette salle gardent son nom.',label:'Retirer la salle',onConfirm:()=>{S.settings.gyms=S.settings.gyms.filter(x=>x.id!==g.id);if(S.settings.gym===g.id)S.settings.gym=null;saveApp();paint()}})}
    else if(a==='export')exportData()
    else if(a==='import')$('#imp').click()
    else if(a==='notif-toggle'){(Push.on?Push.disable():Push.enable()).then(()=>paint())}
    else if(a==='notif-test'){Push.api('test').then(o=>toast(o.sent?'Notification envoyée':'Aucun appareil enregistré')).catch(Push.fail)}
    else if(a==='rp-toggle'){S.settings.restPush=S.settings.restPush===false;saveApp();if(S.settings.restPush===false)Push.cancel();Push.sync().catch(Push.fail);paint()}
    else if(a==='inact-'||a==='inact+'){const v=(S.settings.inactiveDays??3)+(a==='inact+'?1:-1);S.settings.inactiveDays=clamp(v,0,30);saveApp();Push.sync().catch(Push.fail);paint()}}
});

const WEB=!window.claude&&('serviceWorker' in navigator)&&/^https?:$/.test(location.protocol);
const VAPID_PUBLIC='BD2Tl6yg5gaJeI0ltYlXH0YtXe76_4Dzq8tUo34Ct6_I8m-m0fwcNpxNjC5V-dLia_acsC79oEGSG3hD64gS82A';
const canPush=()=>'PushManager' in window&&typeof Notification!=='undefined';
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const urlB64=str=>{const raw=atob((str+'='.repeat((4-str.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))};
const Push={
  on:false,jobs:[],seq:0,
  key(){try{return localStorage.getItem('overload.key')||''}catch(e){return ''}},
  setKey(v){try{localStorage.setItem('overload.key',v)}catch(e){}},
  async api(path,body){
    const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','x-overload-key':Push.key()},body:JSON.stringify(body||{})});
    if(!r.ok){const j=await r.json().catch(()=>({}));const e=new Error(j.error||String(r.status));e.status=r.status;throw e}
    return r.json().catch(()=>({}));
  },
  meta(){return{inactiveDays:S.settings.inactiveDays??3,restPush:S.settings.restPush!==false,alertPush:S.settings.alertOn!==false,lastSessionAt:S.sessions[0]?S.sessions[0].startedAt:null}},
  async sync(force){if(!WEB||(!Push.on&&!force))return;await Push.api('meta',Push.meta())},
  /* programme la fin de repos et l'alerte (2 min 30 par défaut), acc = secondes déjà écoulées */
  async planRest(acc){
    await Push.cancel();const my=Push.seq;
    if(!WEB||!Push.on)return;
    const L=[],st=S.settings,R=st.rest-acc,al=st.alert||150,A=al-acc;
    if(st.restPush!==false&&R>0)L.push({seconds:Math.round(R),kind:'rest'});
    if(st.alertOn!==false&&A>0&&al!==st.rest)L.push({seconds:Math.round(A),kind:'alert',title:fmtDur(al)+' de repos',body:'C’est le moment de reprendre la série.'});
    for(const b of L){try{const j=await Push.api('rest',b);
      if(my!==Push.seq){if(j.id)Push.api('rest-cancel',{id:j.id}).catch(()=>{});return}
      if(j.id)Push.jobs.push(j.id)}catch(e){}}
  },
  async cancel(){Push.seq++;const ids=Push.jobs;Push.jobs=[];if(WEB&&Push.on)for(const id of ids){try{await Push.api('rest-cancel',{id})}catch(e){}}},
  fail(e){toast(e&&e.status===401?'Clé incorrecte':e&&e.message&&e.status===500?'Serveur : '+e.message.slice(0,60):'Impossible de joindre le serveur')},
  async enable(){
    if(!canPush()){toast(isIOS?'Ajoute d’abord l’app à l’écran d’accueil':'Navigateur non compatible');return}
    if(isIOS&&!standalone()){toast('Ouvre l’app depuis son icône d’écran d’accueil');return}
    if(!Push.key()){toast('Colle d’abord ta clé d’accès');return}
    try{
      await Push.sync(true);
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){toast('Autorise les notifications dans les réglages de l’iPhone');return}
      const reg=await navigator.serviceWorker.ready;
      const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(VAPID_PUBLIC)});
      await Push.api('subscribe',{subscription:sub.toJSON()});
      Push.on=true;await Push.sync();toast('Notifications activées');
    }catch(e){Push.fail(e)}
  },
  async disable(){
    try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
      if(sub){try{await Push.api('unsubscribe',{endpoint:sub.endpoint})}catch(e){}await sub.unsubscribe()}}catch(e){}
    Push.on=false;toast('Notifications désactivées');
  },
  init(){
    if(!WEB||!canPush())return;
    navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription()).then(sub=>{
      Push.on=!!sub&&Notification.permission==='granted';
      if(Push.on)Push.sync().catch(()=>{});
      if(S.tab==='set')paint();
    }).catch(()=>{});
  }
};
function notifBlock(){
  if(!WEB)return '';
  const can=canPush(),days=S.settings.inactiveDays??3;
  const help=!can?`<div class="row"><div class="grow"><div class="t">Ajoute Overload à l’écran d’accueil</div><div class="s">${isIOS?'Safari → Partager → Sur l’écran d’accueil, puis ouvre l’app depuis son icône : les notifications ne marchent que comme ça.':'Ce navigateur ne gère pas les notifications.'}</div></div></div>`:'';

    ${can?`<button class="row" data-a="notif-toggle"><div class="grow"><div class="t" style="color:var(--accent)">${Push.on?'Désactiver les notifications':'Activer les notifications'}</div><div class="s">${Push.on?'Activées sur cet appareil':'L’iPhone te demandera l’autorisation'}</div></div></button>`:''}
    <div class="row"><div class="grow"><div class="t">Fin du temps de repos</div><div class="s">Alerte quand le repos atteint ton objectif</div></div><button class="sw" role="switch" aria-checked="${S.settings.restPush!==false}" data-a="rp-toggle" aria-label="Notification de fin de repos"></button></div>
    <div class="row"><div class="grow"><div class="t">Rappel d’inactivité</div><div class="s">Prévenu après ${days?days+' jour'+(days>1?'s':''):'X jours'} sans séance</div></div><div class="mini-step"><button data-a="inact-" aria-label="Moins un jour">−</button><b style="min-width:3.4ch">${days?days+' j':'Off'}</b><button data-a="inact+" aria-label="Plus un jour">+</button></div></div>
    ${Push.on?`<button class="row" data-a="notif-test"><div class="grow"><div class="t" style="color:var(--accent)">Envoyer une notification test</div></div></button>`:''}</div>`;
}
